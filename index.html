<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>羽毛球AA计费器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7fa;
            padding: 16px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .header-wrap {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom:24px;
            gap:12px;
        }
        h1 {
            font-size:22px;
            color:#222;
            flex-shrink:0;
        }
        .discount-box{
            background:#e8f4fc;
            border:1px solid #90caf9;
            border-radius:10px;
            padding:10px 12px;
            display:flex;
            align-items:center;
            gap:6px;
            flex-shrink:1;
        }
        .discount-box input{
            width:70px;
        }
        .section-title{
            font-size:18px;
            font-weight:bold;
            margin:22px 0 14px;
            color:#333;
        }
        .item-row{
            display:flex;
            align-items:center;
            margin-bottom:14px;
            gap:10px;
        }
        .item-row label{
            width:110px;
            font-size:16px;
            color:#333;
            flex-shrink:0;
        }
        .item-row input{
            flex:1;
            padding:12px 10px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }
        .unit-text{
            flex-shrink:0;
            font-size:16px;
        }
        .divider{
            height:1px;
            background:#dddddd;
            margin:18px 0;
        }
        .result-block{
            margin-top:24px;
            background:#e8f9ee;
            border-radius:12px;
            padding:18px;
        }
        .result-block h3{
            font-size:18px;
            margin-bottom:14px;
        }
        .result-item{
            font-size:17px;
            margin-bottom:10px;
        }
        .money-num{
            font-size:20px;
            font-weight:bold;
            color:#008833;
        }
        .total-check-row{
            margin-top:12px;
            font-size:15px;
            color:#444;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-wrap">
        <h1>🏸羽毛球AA计费</h1>
        <div class="discount-box">
            <span>女生减免：</span>
            <input id="girlDiscount" type="number" placeholder="" value="5">
            <span>元</span>
        </div>
    </div>

    <div class="section-title">费用明细</div>

    <div class="item-row">
        <label>场地费：</label>
        <input id="placeFee" type="number" placeholder="">
        <span class="unit-text">元</span>
    </div>

    <div class="item-row">
        <label>羽毛球个数：</label>
        <input id="ballCount" type="number" placeholder="">
        <span class="unit-text">个</span>
    </div>

    <div class="item-row">
        <label>羽毛球单价：</label>
        <input id="ballPrice" type="number" placeholder="">
        <span class="unit-text">元/个</span>
    </div>

    <div class="divider"></div>

    <div class="item-row">
        <label>✅总费用(手动改)：</label>
        <input id="totalFee" type="number" placeholder="">
        <span class="unit-text">元</span>
    </div>

    <div class="section-title">参与人数</div>

    <div class="item-row">
        <label>男生人数：</label>
        <input id="manCount" type="number" placeholder="">
        <span class="unit-text">人</span>
    </div>
    <div class="item-row">
        <label>女生人数：</label>
        <input id="womanCount" type="number" placeholder="">
        <span class="unit-text">人</span>
    </div>

    <div class="result-block">
        <h3>📊分摊结果</h3>
        <div class="result-item">男生每人应付：<span class="money-num" id="manPay">0.00</span> 元</div>
        <div class="result-item">女生每人应付：<span class="money-num" id="womanPay">0.00</span> 元</div>
        <div class="total-check-row">所有人合计：<span id="sumCheck">0.00</span> 元</div>
    </div>

</div>

<script>
    const $ = id=>document.getElementById(id);
    const inputs = [
        $("placeFee"),$("ballCount"),$("ballPrice"),
        $("totalFee"),$("manCount"),$("womanCount"),$("girlDiscount")
    ];

    function getNum(input){
        let v = parseFloat(input.value);
        return isNaN(v)||v<0 ? 0 : v;
    }

    function calc(){
        const place = getNum($("placeFee"));
        const bCount = getNum($("ballCount"));
        const bPrice = getNum($("ballPrice"));
        const manualTotal = getNum($("totalFee"));
        const man = getNum($("manCount"));
        const woman = getNum($("womanCount"));
        const discount = getNum($("girlDiscount"));

        //计算自动总费用
        const autoTotal = place + bCount * bPrice;
        //如果手动总费用大于0，优先使用手动输入
        const totalCost = manualTotal>0 ? manualTotal : autoTotal;

        const totalPeople = man + woman;
        let manPay = 0, womanPay =0;
        let sumCheck =0;

        if(totalPeople >0){
            //正确分摊公式：总费用 = man*M + woman*(M‑d)
            // M = (totalCost + woman * discount) / (man+woman)
            const M = (totalCost + woman * discount) / totalPeople;
            manPay = M;
            womanPay = M - discount;
        }
        sumCheck = manPay * man + womanPay * woman;

        $("manPay").innerText = manPay.toFixed(2);
        $("womanPay").innerText = womanPay.toFixed(2);
        $("sumCheck").innerText = sumCheck.toFixed(2);
    }

    inputs.forEach(inp=>{
        inp.addEventListener('input',calc);
    })
    calc();
</script>

</body>
</html>
